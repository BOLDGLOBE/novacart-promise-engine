name: Deploy to GitHub Pages

# The prototype is static HTML/CSS/JS with no build step, so the repository root
# IS the site. We upload it as-is rather than running a bundler.

on:
  push:
    branches: [main]
  workflow_dispatch:          # lets you re-run a deploy from the Actions tab

permissions:
  contents: read              # read the repo to check it out
  pages: write                # publish to Pages
  id-token: write             # authenticate the deployment

# Never let two deploys race. A newer push wins; an in-flight one is cancelled.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'             # no build output — the repo root is the site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
